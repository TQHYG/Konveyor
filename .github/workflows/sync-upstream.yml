name: Sync upstream

# Keeps this localization fork in step with DevL0rd/Konveyor.
#
# Every day (and on demand) it merges upstream's main branch into this fork's
# main branch, refreshes i18n/zh_CN.json with any new strings, pushes the
# result, and reports anything that needs a human either in the job summary or
# as an issue (if the repository has Issues enabled).
#
# This is safe because the fork does not edit upstream source files except for
# four clearly marked hook lines in install.sh, so normal merges stay clean.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/DevL0rd/Konveyor.git 2>/dev/null || true
          git fetch --tags upstream

      - name: Merge upstream
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh the translation dictionary
        if: steps.merge.outputs.conflict != 'true'
        run: |
          python3 tools/i18n/i18n.py extract --lang zh_CN | tee /tmp/i18n-extract.txt
          python3 tools/i18n/i18n.py status --languages zh_CN | tee /tmp/i18n-status.txt

      - name: Commit and push
        if: steps.merge.outputs.conflict != 'true'
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream and refresh zh_CN translations"
          fi
          git push

      - name: Report a merge conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >>"$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 上游合并冲突

          自动合并 `upstream/main` 时发生冲突，本次没有推送任何内容。请在本地处理：

          ```sh
          git fetch upstream
          git merge upstream/main
          # 解决冲突后
          git push
          ```

          冲突通常只出现在 `install.sh` 中标记为 “Konveyor Chinese localization (fork)” 的四处钩子附近。
          EOF
          gh issue create \
            --title "上游合并冲突，需要手动处理" \
            --body "自动合并 \`upstream/main\` 时发生冲突，本次没有推送任何内容。请在本地运行 \`git fetch upstream && git merge upstream/main\`，解决冲突后推送。" \
            2>/dev/null || echo "Issues are disabled; see the job summary instead."

      - name: Report untranslated strings
        if: steps.merge.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(python3 - <<'PY'
          import json
          table = json.load(open('i18n/zh_CN.json', encoding='utf-8'))
          print(sum(1 for k, v in table.items() if not k.startswith('$') and k != '_comment' and not v))
          PY
          )
          echo "untranslated: $count"
          if [ "$count" -eq 0 ]; then
            echo "## 翻译状态" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "所有字符串均已翻译。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import json
          table = json.load(open('i18n/zh_CN.json', encoding='utf-8'))
          empty = [k for k, v in table.items() if not k.startswith('$') and k != '_comment' and not v]
          lines = ['## 待翻译的字符串', '',
                   f'共有 **{len(empty)}** 条字符串尚未翻译。',
                   '编辑 `i18n/zh_CN.json` 填入中文译文即可；键是英文原文，值是译文。',
                   '运行 `python3 tools/i18n/i18n.py status --verbose` 可查看完整列表。', '']
          lines += [f'- `{k}`' for k in empty[:300]]
          if len(empty) > 300:
              lines.append(f'- …以及另外 {len(empty) - 300} 条')
          with open('/tmp/i18n-report.md', 'w', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY
          cat /tmp/i18n-report.md >> "$GITHUB_STEP_SUMMARY"
          gh issue create --title "有 $count 条字符串待翻译" --body-file /tmp/i18n-report.md \
            2>/dev/null || echo "Issues are disabled; see the job summary instead."
