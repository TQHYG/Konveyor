name: Sync upstream and package source

# This fork builds Konveyor on the user's machine with install-zh.sh, so the
# workflow does NOT build anything. It only:
#
#   1. merges DevL0rd/Konveyor's main into this fork (when there is no conflict)
#   2. refreshes i18n/zh_CN.json with any new strings
#   3. pushes the result
#   4. packages the source (including the Plasma-Shared submodule) into a Release
#   5. reports conflicts and untranslated strings in the summary / as an issue
#
# The repository stays a clean mirror of upstream except for added files and a
# one-line .gitmodules fix, so merges normally succeed.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force_release:
        description: "即使没有变化也打包并发布一个源码 Release"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/DevL0rd/Konveyor.git 2>/dev/null || true
          git fetch --tags upstream

      - name: Merge upstream
        id: merge
        run: |
          changed=false
          if ! git merge-base --is-ancestor upstream/main HEAD; then
            if git merge --no-edit upstream/main; then
              changed=true
            else
              git merge --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Refresh the translation dictionary
        if: steps.merge.outputs.conflict != 'true'
        id: i18n
        run: |
          python3 tools/i18n/i18n.py extract --lang zh_CN | tee /tmp/i18n-extract.txt
          python3 tools/i18n/i18n.py status --languages zh_CN | tee /tmp/i18n-status.txt
          if ! git diff --quiet -- i18n/zh_CN.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=${{ steps.merge.outputs.changed }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.merge.outputs.conflict != 'true'
        id: push
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream and refresh zh_CN translations"
          fi
          git push
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package the source
        if: steps.merge.outputs.conflict != 'true' && (steps.i18n.outputs.changed == 'true' || inputs.force_release)
        env:
          TAG: zh-${{ github.run_number }}
        run: |
          rm -rf /tmp/konveyor-zh
          # Public repo: clone without a token so no credentials end up in .git/config
          git clone --quiet --depth 1 --recurse-submodules --branch main \
            "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/konveyor-zh
          tar -czf "/tmp/konveyor-zh-${TAG}.tar.gz" -C /tmp konveyor-zh
          echo "asset=/tmp/konveyor-zh-${TAG}.tar.gz" >> "$GITHUB_OUTPUT"
        id: package

      - name: Publish a release
        if: steps.merge.outputs.conflict != 'true' && (steps.i18n.outputs.changed == 'true' || inputs.force_release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: zh-${{ github.run_number }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          gh release delete "$TAG" --yes 2>/dev/null || true
          cat >/tmp/release-notes.md <<'EOF'
          自动同步上游 [DevL0rd/Konveyor](https://github.com/DevL0rd/Konveyor) 并刷新中文词条。

          下载下方的源码包，解压后运行：

          ```sh
          ./install-zh.sh
          ```

          源码包已包含 `widgets/shared/common` 子模块内容，并且保留 `.git`，因此可以直接安装。
          （也可以直接在本复刻里执行 `git clone --recurse-submodules` 后运行 `./install-zh.sh`。）
          EOF
          gh release create "$TAG" "/tmp/konveyor-zh-${TAG}.tar.gz" \
            --title "中文版源码 $TAG" \
            --notes-file /tmp/release-notes.md \
            --target main \
            --latest

      - name: Report a merge conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >>"$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 上游合并冲突

          自动合并 `upstream/main` 时发生冲突，本次没有推送任何内容。请在本地处理：

          ```sh
          git fetch upstream
          git merge upstream/main
          # 解决冲突后
          git push
          ```

          本复刻对上游文件的改动只有 `.gitmodules` 一行，冲突很少；若出现，优先保留我们的子模块地址与新增文件。
          EOF
          gh issue create \
            --title "上游合并冲突，需要手动处理" \
            --body "自动合并 upstream/main 时发生冲突，本次没有推送任何内容。请在本地运行 git fetch upstream && git merge upstream/main，解决冲突后推送。" \
            2>/dev/null || echo "Issues are disabled; see the job summary instead."

      - name: Report untranslated strings
        if: steps.merge.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(python3 - <<'PY'
          import json
          table = json.load(open('i18n/zh_CN.json', encoding='utf-8'))
          print(sum(1 for k, v in table.items() if not k.startswith('$') and k != '_comment' and not v))
          PY
          )
          echo "untranslated: $count"
          if [ "$count" -eq 0 ]; then
            {
              echo "## 翻译状态"
              echo
              echo "所有字符串均已翻译。"
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import json
          table = json.load(open('i18n/zh_CN.json', encoding='utf-8'))
          empty = [k for k, v in table.items() if not k.startswith('$') and k != '_comment' and not v]
          lines = ['## 待翻译的字符串', '',
                   f'共有 **{len(empty)}** 条字符串尚未翻译。',
                   '编辑 `i18n/zh_CN.json` 填入中文译文即可；键是英文原文，值是译文。',
                   '运行 `python3 tools/i18n/i18n.py status --verbose` 可查看完整列表。', '']
          lines += [f'- `{k}`' for k in empty[:300]]
          if len(empty) > 300:
              lines.append(f'- …以及另外 {len(empty) - 300} 条')
          with open('/tmp/i18n-report.md', 'w', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY
          cat /tmp/i18n-report.md >>"$GITHUB_STEP_SUMMARY"
          gh issue create --title "有 $count 条字符串待翻译" --body-file /tmp/i18n-report.md \
            2>/dev/null || echo "Issues are disabled; see the job summary instead."
